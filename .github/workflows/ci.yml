name: CI

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: politics
          POSTGRES_PASSWORD: politics_ci_password
          POSTGRES_DB: politics_game_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U politics -d politics_game_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://politics:politics_ci_password@localhost:5432/politics_game_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build

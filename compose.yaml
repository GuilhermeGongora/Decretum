# Local development only. Credentials below are NOT secrets and must never be used outside a
# developer machine. Override them through a local, untracked .env file if needed.
name: decretum

services:
  postgres:
    image: postgres:17-alpine
    container_name: decretum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-decretum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-decretum_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-decretum}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
